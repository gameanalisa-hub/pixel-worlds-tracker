
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Worlds Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 24px 14px;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 { text-align: center; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input { border: 1px solid #ccc; }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #logout { background: #555; }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      margin-top: 16px;
      font-size: 14px;
    }

    .hidden { display: none; }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>Pixel Worlds Tracker</h2>

    <p class="note">
      Upload screenshot untuk membaca data pertanian
      dan progres event Pixel Worlds.
    </p>

    <section id="login">
      <h3>Login</h3>

      <input id="email" type="email" placeholder="Email Supabase">
      <input id="password" type="password" placeholder="Password Supabase">

      <button id="loginButton">Login</button>
    </section>

    <section id="tracker" class="hidden">
      <h3>Upload Screenshot</h3>

      <input
        id="screenshot"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <p class="note">
        Format: JPG, PNG, atau WEBP. Maksimal 4,8 MB.
      </p>

      <button id="uploadButton">Proses Screenshot</button>
      <button id="logout">Logout</button>
    </section>

    <div id="status" role="status"></div>

  </div>

  <script>
    // =====================================
    // SUPABASE CONFIGURATION
    // =====================================

    const SUPABASE_URL =
      "https://udsumovcwgqxfhbviosf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YwtD5_DNH8oPtp0bOgeXOA_9rIBw1oU";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const BUCKET_NAME = "pixel-worlds-screenshots";

    const loginSection = document.getElementById("login");
    const trackerSection = document.getElementById("tracker");
    const statusBox = document.getElementById("status");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    // =====================================
    // LOGIN SCREEN
    // =====================================

    async function updateScreen() {
      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        showStatus("Gagal memeriksa login: " + error.message);
        return;
      }

      loginSection.classList.toggle("hidden", !!session);
      trackerSection.classList.toggle("hidden", !session);
    }

    // =====================================
    // LOGIN
    // =====================================

    document.getElementById("loginButton")
      .addEventListener("click", async () => {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showStatus("Masukkan email dan password terlebih dahulu.");
          return;
        }

        showStatus("Sedang login...");

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showStatus("Login gagal: " + error.message);
          return;
        }

        showStatus("Login berhasil.");
        await updateScreen();
      });

    // =====================================
    // LOGOUT
    // =====================================

    document.getElementById("logout")
      .addEventListener("click", async () => {

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          showStatus("Logout gagal: " + error.message);
          return;
        }

        showStatus("Kamu sudah logout.");
        await updateScreen();
      });

    // =====================================
    // COMPRESS SCREENSHOT
    // =====================================

    async function compressImage(file) {
      let bitmap;

      try {
        bitmap = await createImageBitmap(file);

        const maxSide = 1280;

        const scale = Math.min(
          1,
          maxSide / Math.max(bitmap.width, bitmap.height)
        );

        const canvas = document.createElement("canvas");

        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));

        const context = canvas.getContext("2d");

        if (!context) {
          throw new Error("Gagal memproses gambar.");
        }

        context.drawImage(
          bitmap,
          0,
          0,
          canvas.width,
          canvas.height
        );

        bitmap.close();
        bitmap = null;

        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("Gagal mengompres gambar."));
              return;
            }

            resolve(blob);
          }, "image/jpeg", 0.75);
        });

      } finally {
        if (bitmap) {
          bitmap.close();
        }
      }
    }

    // =====================================
    // UPLOAD SCREENSHOT
    // =====================================

    document.getElementById("uploadButton")
      .addEventListener("click", async () => {

        const button = document.getElementById("uploadButton");
        const file = document.getElementById("screenshot").files[0];

        if (!file) {
          showStatus("Pilih screenshot terlebih dahulu.");
          return;
        }

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
          showStatus("Format gambar harus JPG, PNG, atau WEBP.");
          return;
        }

        if (file.size > 4.8 * 1024 * 1024) {
          showStatus("Ukuran gambar terlalu besar. Maksimal 4,8 MB.");
          return;
        }

        button.disabled = true;

        try {
          // Pastikan pengguna sudah login
          const {
            data: { session },
            error: sessionError
          } = await supabaseClient.auth.getSession();

          if (sessionError || !session) {
            throw new Error("Sesi login berakhir. Silakan login kembali.");
          }

          // Kompres gambar menjadi JPG
          showStatus("1/4 - Mengompres screenshot...");

          const imageBlob = await compressImage(file);

          // Buat lokasi file berdasarkan ID pengguna
          const filePath =
            session.user.id + "/" +
            Date.now() + ".jpg";

          // Upload ke Supabase Storage private bucket
          showStatus("2/4 - Mengunggah screenshot ke Storage...");

          const { error: uploadError } =
            await supabaseClient.storage
              .from(BUCKET_NAME)
              .upload(filePath, imageBlob, {
                contentType: "image/jpeg",
                upsert: false
              });

          if (uploadError) {
            throw new Error(
              "Upload Storage gagal: " + uploadError.message
            );
          }

          // Buat Signed URL selama 1 jam
          showStatus("3/4 - Membuat Signed URL...");

          const { data: signedData, error: signedError } =
            await supabaseClient.storage
              .from(BUCKET_NAME)
              .createSignedUrl(filePath, 3600);

          if (signedError || !signedData?.signedUrl) {
            throw new Error(
              "Gagal membuat Signed URL: " +
              (signedError?.message || "URL tidak tersedia.")
            );
          }

          // Kirim URL gambar ke Edge Function
          showStatus("4/4 - Mengirim URL gambar ke Make...");

          const { data, error } =
            await supabaseClient.functions.invoke(
              "pixel-worlds-processor",
              {
                body: {
                  imageUrl: signedData.signedUrl,
                  mimeType: "image/jpeg",
                  fileName: file.name,
                  storagePath: filePath
                }
              }
            );

          if (error) {
            let detail = error.message || "Terjadi kesalahan.";

            try {
              if (error.context?.clone) {
                const response = await error.context.clone().json();
                detail = response.error ||
                         response.message ||
                         JSON.stringify(response);
              }
            } catch (_) {}

            throw new Error(detail);
          }

          if (!data || !data.success) {
            throw new Error(data?.error || "Proses gagal.");
          }

          showStatus(
            "SCREENSHOT BERHASIL DIKIRIM!\n\n" +
            "Nama file: " + file.name + "\n" +
            "Lokasi Storage: " + filePath + "\n\n" +
            "Status: " + (data.message || "Dikirim ke Make.")
          );

        } catch (error) {
          console.error("Upload error:", error);

          showStatus(
            "TERJADI KESALAHAN:\n\n" +
            (error.message || String(error))
          );

        } finally {
          button.disabled = false;
        }
      });

    // =====================================
    // INITIALIZE
    // =====================================

    updateScreen();

  </script>
</body>
</html>
